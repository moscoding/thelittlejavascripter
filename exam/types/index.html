<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Primitive datatypes</title>
<!-- Тест написан заново в 2026 году: оригинальные exam.js и exam.css не сохранились. -->
<link href="https://fonts.googleapis.com/css?family=Roboto:400,500,700&amp;subset=latin,cyrillic" rel="stylesheet">
<link href="https://fonts.googleapis.com/css?family=Roboto+Condensed:700&amp;subset=latin,cyrillic" rel="stylesheet">
<link rel="icon" type="image/png" href="../../images/favicon-32x32.png" sizes="32x32">
<link rel="icon" type="image/png" href="../../images/favicon-16x16.png" sizes="16x16">
<style>
  :root { --green: #1AA367; --teal: #00A9A2; --red: #D54646; --ink: #222; --muted: #7F7F7F; --bg: #fff; --panel: #F4F4F4; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font-family: 'Roboto', sans-serif; display: flex; flex-direction: column; }
  header { background: var(--teal); color: #fff; text-align: center; padding: 24px 16px; }
  header a { color: #fff; text-decoration: none; font-family: 'Roboto Condensed', sans-serif; font-size: 14px; letter-spacing: 1px; text-transform: uppercase; }
  header h1 { font-family: 'Roboto Condensed', sans-serif; font-size: 36px; margin: 8px 0 0; }
  main { flex: 1; max-width: 720px; width: 100%; margin: 0 auto; padding: 40px 16px 160px; text-align: center; }
  .prompt { color: var(--muted); font-size: 16px; margin: 0 0 16px; }
  .value { font-family: Menlo, Consolas, monospace; font-size: 40px; line-height: 1.2; padding: 32px 16px; background: var(--panel); border-radius: 8px; word-break: break-word; }
  .answers { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 24px; }
  .answers button { font: 500 16px Menlo, Consolas, monospace; padding: 14px 8px; border: 2px solid var(--teal); border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .answers button:hover { background: #E6F6F5; }
  .answers button:disabled { cursor: default; opacity: .6; }
  .feedback { min-height: 72px; margin-top: 24px; font-size: 16px; line-height: 24px; }
  .feedback.ok { color: var(--green); }
  .feedback.bad { color: var(--red); }
  .feedback code { font-family: Menlo, Consolas, monospace; background: var(--panel); padding: 1px 4px; border-radius: 3px; color: var(--ink); }
  .next { margin-top: 8px; font: 500 15px 'Roboto', sans-serif; padding: 10px 24px; border: 0; border-radius: 6px; background: var(--teal); color: #fff; cursor: pointer; }
  .bottom-panel { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; box-shadow: 0 -2px 6px rgba(0,0,0,.12); }
  .progress { height: 8px; background: #E5E5E5; }
  .progress div { height: 100%; width: 0; background: var(--green); transition: width .3s; }
  .bottom-text { display: flex; justify-content: space-between; align-items: center; max-width: 720px; margin: 0 auto; padding: 16px; font-family: 'Roboto Condensed', sans-serif; font-size: 18px; }
  .bottom-text span:last-child { color: var(--muted); }
  .win { position: fixed; inset: 0; background: var(--green); color: #fff; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; }
  .win.shown { display: flex; }
  .win h2 { font-family: 'Roboto Condensed', sans-serif; font-size: 96px; line-height: 1; margin: 0 0 24px; }
  .win p { font-size: 20px; }
  .win a { color: #fff; }
  @media (max-width: 560px) {
    .answers { grid-template-columns: repeat(2, 1fr); }
    .value { font-size: 28px; }
    .win h2 { font-size: 64px; }
  }
</style>
</head>
<body>
<header>
  <a href="../../day1.html">← День 1. Грамматика</a>
  <h1>Primitive datatypes</h1>
</header>
<main>
  <p class="prompt">К какому типу относится это значение?</p>
  <div class="value" id="value"></div>
  <div class="answers" id="answers"></div>
  <div class="feedback" id="feedback"></div>
</main>
<div class="bottom-panel">
  <div class="progress"><div id="progress"></div></div>
  <div class="bottom-text"><span>Ответьте правильно 5 раз подряд</span><span id="score">0 / 5</span></div>
</div>
<div class="win" id="win">
  <h2>YOU<br>WON!</h2>
  <p>Отлично! Теперь загляните в <a href="../../links.html">подборку ссылок</a>.</p>
  <p><a href="#" id="again">Пройти ещё раз</a></p>
</div>
<script>
  const TYPES = ['number', 'bigint', 'string', 'boolean', 'symbol', 'undefined', 'null', 'object'];
  const QUESTIONS = [
    { code: '42', type: 'number' },
    { code: '-3.14', type: 'number' },
    { code: '0xff', type: 'number' },
    { code: 'NaN', type: 'number', note: 'NaN («не число») — всё равно значение типа number.' },
    { code: 'Infinity', type: 'number' },
    { code: '10n', type: 'bigint', note: 'Суффикс n превращает литерал в BigInt (ES2020).' },
    { code: '"42"', type: 'string', note: 'Кавычки делают из числа строку.' },
    { code: "''", type: 'string', note: 'Пустая строка — тоже строка.' },
    { code: '`2 + 2 = ${2 + 2}`', type: 'string', note: 'Шаблонная строка (ES2015) — это string.' },
    { code: 'true', type: 'boolean' },
    { code: '"false"', type: 'string', note: 'В кавычках — это строка, а не boolean.' },
    { code: 'Symbol("id")', type: 'symbol', note: 'Symbol — уникальный идентификатор (ES2015).' },
    { code: 'undefined', type: 'undefined' },
    { code: 'null', type: 'null', note: 'Внимание: typeof null возвращает "object" — это историческая ошибка языка, но сам null — отдельный примитивный тип.' },
    { code: '{}', type: 'object' },
    { code: '[1, 2, 3]', type: 'object', note: 'Массивы — это объекты. Проверить массив можно через Array.isArray().' },
    { code: '/abc/', type: 'object', note: 'Регулярные выражения — объекты.' },
    { code: 'new Date()', type: 'object' },
    { code: 'function () {}', type: 'object', note: 'Функции — объекты (хотя typeof для них возвращает "function").' },
  ];
  const GOAL = 5;
  const $ = (id) => document.getElementById(id);
  let streak = 0;
  let current = null;

  TYPES.forEach((type) => {
    const button = document.createElement('button');
    button.textContent = type;
    button.addEventListener('click', () => answer(type));
    $('answers').appendChild(button);
  });

  function escapeHtml(text) {
    return text.replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
  }

  function ask() {
    let next;
    do { next = QUESTIONS[Math.floor(Math.random() * QUESTIONS.length)]; } while (next === current);
    current = next;
    $('value').textContent = current.code;
    $('feedback').className = 'feedback';
    $('feedback').innerHTML = '';
    document.querySelectorAll('.answers button').forEach((b) => { b.disabled = false; });
  }

  function answer(type) {
    document.querySelectorAll('.answers button').forEach((b) => { b.disabled = true; });
    const right = type === current.type;
    streak = right ? streak + 1 : 0;
    $('score').textContent = `${streak} / ${GOAL}`;
    $('progress').style.width = `${(streak / GOAL) * 100}%`;
    const note = current.note ? ' ' + escapeHtml(current.note) : '';
    $('feedback').className = 'feedback ' + (right ? 'ok' : 'bad');
    $('feedback').innerHTML = (right ? 'Верно!' : `Нет, это <code>${current.type}</code>. Серия сброшена.`) + note +
      '<br><button class="next" id="next">Дальше</button>';
    $('next').addEventListener('click', ask);
    $('next').focus();
    if (streak >= GOAL) $('win').classList.add('shown');
  }

  $('again').addEventListener('click', (event) => {
    event.preventDefault();
    streak = 0;
    $('score').textContent = `0 / ${GOAL}`;
    $('progress').style.width = '0';
    $('win').classList.remove('shown');
    ask();
  });

  ask();
</script>
</body>
</html>
